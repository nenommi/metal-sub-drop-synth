name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect plugins
        shell: pwsh
        run: |
          $src = "build/MetalSubDrop_artefacts/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "$src/VST3/Metal Sub Drop.vst3" dist/
          Copy-Item "$src/CLAP/Metal Sub Drop.clap" dist/
          Copy-Item "$src/Standalone/Metal Sub Drop.exe" dist/
          Get-ChildItem -Recurse dist

      - uses: actions/upload-artifact@v4
        with:
          name: MetalSubDrop-Windows-x64
          path: dist
